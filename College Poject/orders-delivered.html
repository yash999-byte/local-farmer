<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivered Orders - Local Farmer App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .app-container {
            max-width: 414px;
            margin: 0 auto;
            background-color: #f8fafc;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        /* Simple hover effect for the stars to make them feel interactive */
        .star-rating i:hover,
        .star-rating i:hover ~ i {
            color: #fbbf24; /* Tailwind yellow-400 */
        }
        .star-container:hover i {
            color: #fbbf24;
        }
        .star-container i:hover ~ i {
            color: #d1d5db; /* Tailwind gray-300 */
        }
    </style>
</head>
<body class="bg-gray-200">

<div class="app-container pb-24">
    
    <!-- Header -->
    <div class="px-5 py-4 flex items-center bg-white sticky top-0 z-10 shadow-sm">
        <a href="index.html" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 transition text-gray-800 -ml-2">
            <i class="fa-solid fa-arrow-left text-lg"></i>
        </a>
        <h1 class="text-lg font-bold text-gray-800 ml-2">My Orders</h1>
    </div>

    <!-- Order Tabs (Delivered is Active) -->
    <div class="bg-white px-5 border-b border-gray-200 flex justify-between items-center w-full pt-2">
        <a href="orders.html" class="pb-3 block">
            <span class="text-sm font-medium text-gray-500 hover:text-gray-800 transition">All</span>
        </a>
        <a href="orders-processing.html" class="pb-3 block">
            <span class="text-sm font-medium text-gray-500 hover:text-gray-800 transition">Processing</span>
        </a>
        <a href="orders-shipped.html" class="pb-3 block">
            <span class="text-sm font-medium text-gray-500 hover:text-gray-800 transition">Shipped</span>
        </a>
        <!-- Active Tab -->
        <a href="orders-delivered.html" class="pb-3 border-b-2 border-green-700 block">
            <span class="text-sm font-bold text-green-700">Delivered</span>
        </a>
    </div>

    <!-- Orders List (Filtered to Delivered Only) -->
    <div class="px-5 mt-4 space-y-4">
        
        <!-- Order Card (Delivered with Rating UI) -->
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 relative">
            
            <!-- Top Section: Order Info -->
            <div class="flex justify-between items-start border-b border-gray-100 pb-4 mb-4">
                <div>
                    <h3 class="font-bold text-gray-800 text-sm">Order ID: #ORD1001</h3>
                    <p class="text-xs text-gray-500 mt-1">Delivered on: 20 May 2024, 11:30 AM</p>
                </div>
                <span class="bg-green-100 text-green-800 text-[10px] font-bold px-3 py-1.5 rounded-lg flex items-center">
                    <i class="fa-solid fa-check-circle mr-1.5"></i> Delivered
                </span>
            </div>
            
            <!-- Items Summary -->
            <div class="flex justify-between items-center mb-5">
                <div class="flex space-x-3">
                    <div class="w-12 h-12 bg-gray-50 rounded-xl flex items-center justify-center text-2xl border border-gray-100">🍅</div>
                    <div class="w-12 h-12 bg-gray-50 rounded-xl flex items-center justify-center text-2xl border border-gray-100">🥬</div>
                    <div class="w-12 h-12 bg-gray-50 rounded-xl flex items-center justify-center text-2xl border border-gray-100">🍌</div>
                </div>
                <div class="text-right">
                    <p class="text-[11px] text-gray-500 font-medium">3 Items</p>
                    <p class="font-bold text-gray-800 text-sm mt-0.5">Total: <span class="text-green-700">₹81</span></p>
                </div>
            </div>

            <!-- Attractive Feature: Rating & Reorder Section -->
            <div class="bg-green-50/50 rounded-2xl p-4 border border-green-100 mt-2">
                <p class="text-xs font-bold text-gray-800 text-center mb-2">How was your farm-fresh produce?</p>
                
                <!-- Interactive Stars -->
                <div class="flex justify-center space-x-2 text-2xl mb-4 star-container cursor-pointer transition">
                    <i class="fa-solid fa-star text-yellow-400"></i>
                    <i class="fa-solid fa-star text-yellow-400"></i>
                    <i class="fa-solid fa-star text-yellow-400"></i>
                    <i class="fa-solid fa-star text-yellow-400"></i>
                    <i class="fa-regular fa-star text-gray-300 hover:text-yellow-400 transition"></i>
                </div>

                <div class="flex space-x-3">
                    <button class="flex-1 bg-white text-gray-700 border border-gray-200 font-semibold text-xs py-2.5 rounded-xl hover:bg-gray-50 transition shadow-sm">
                        Write Review
                    </button>
                    <button class="flex-1 bg-green-700 text-white font-semibold text-xs py-2.5 rounded-xl hover:bg-green-800 transition shadow-sm flex items-center justify-center">
                        <i class="fa-solid fa-rotate-right mr-1.5"></i> Buy Again
                    </button>
                </div>
            </div>

        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <div class="fixed bottom-0 w-full max-w-[414px] bg-white border-t border-gray-200 flex justify-between px-6 py-3 pb-5 z-20">
        <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-green-700 transition">
            <i class="fa-solid fa-house mb-1"></i>
            <span class="text-[10px] font-semibold">Home</span>
        </a>
        <div class="flex flex-col items-center text-gray-400 hover:text-green-700 transition">
            <i class="fa-solid fa-border-all mb-1"></i>
            <span class="text-[10px] font-semibold">Categories</span>
        </div>
        <a href="cart.html" class="flex flex-col items-center text-gray-400 hover:text-green-700 transition relative">
            <i class="fa-solid fa-cart-shopping mb-1"></i>
            <span class="text-[10px] font-semibold">Cart</span>
            <span class="absolute -top-1 -right-2 bg-red-500 text-white text-[8px] font-bold px-1.5 py-0.5 rounded-full">3</span>
        </a>
        <a href="orders.html" class="flex flex-col items-center text-green-700">
            <i class="fa-solid fa-clipboard-list mb-1"></i>
            <span class="text-[10px] font-semibold">Orders</span>
        </a>
        <div class="flex flex-col items-center text-gray-400 hover:text-green-700 transition">
            <i class="fa-regular fa-user mb-1"></i>
            <span class="text-[10px] font-semibold">Profile</span>
        </div>
    </div>

</div>

</body>
</html>

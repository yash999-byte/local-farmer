<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Local Farmer App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .app-container {
            max-width: 414px;
            margin: 0 auto;
            background-color: #f8fafc;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body class="bg-gray-200">

<div class="app-container">
    
    <!-- Header -->
    <div class="px-5 py-4 flex items-center bg-transparent sticky top-0 z-10">
        <a href="login.html" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-200 transition text-gray-800 -ml-2">
            <i class="fa-solid fa-arrow-left text-lg"></i>
        </a>
    </div>

    <!-- Content Area -->
    <div class="px-6 pt-4 flex-grow flex flex-col">
        
        <!-- Icon & Titles -->
        <div class="mb-8">
            <div class="w-16 h-16 bg-green-100 rounded-2xl flex items-center justify-center text-green-700 text-3xl mb-6 shadow-sm border border-green-200">
                <i class="fa-solid fa-unlock-keyhole"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 mb-2" id="page-title">Forgot Password?</h1>
            <p class="text-sm text-gray-500 leading-relaxed" id="page-desc">
                Don't worry! Enter the phone number linked to your account and we will send you an OTP to reset your password.
            </p>
        </div>

        <!-- Step 1: Phone Number Section -->
        <div id="phone-section" class="flex flex-col flex-grow">
            <div class="mb-8">
                <label class="block text-xs font-semibold text-gray-600 mb-2">Registered Phone Number</label>
                <div class="relative">
                    <i class="fa-solid fa-phone absolute left-4 top-[14px] text-gray-400"></i>
                    <input type="tel" 
                           id="phone-input"
                           placeholder="10-digit mobile number" 
                           maxlength="10" 
                           oninput="this.value = this.value.replace(/[^0-9]/g, '')" 
                           class="w-full bg-white border border-gray-200 py-3 pl-11 pr-4 rounded-xl text-sm outline-none focus:ring-2 focus:ring-green-600 shadow-sm text-gray-800 font-medium">
                </div>
            </div>

            <!-- Send OTP Button -->
            <button type="button" onclick="sendOTP()" class="block text-center w-full bg-green-700 text-white font-bold text-sm py-3.5 rounded-xl shadow-md hover:bg-green-800 transition">
                Send OTP
            </button>
        </div>

        <!-- Step 2: OTP Verification Section (Hidden by Default) -->
        <div id="otp-section" class="flex flex-col flex-grow hidden">
            <div class="mb-8">
                <label class="block text-xs font-semibold text-gray-600 mb-2">Enter 4-Digit OTP</label>
                <div class="relative">
                    <i class="fa-solid fa-message absolute left-4 top-[14px] text-gray-400"></i>
                    <input type="text" 
                           id="otp-input"
                           placeholder="e.g. 1234" 
                           maxlength="4" 
                           oninput="checkOTP(this)" 
                           class="w-full bg-white border border-gray-200 py-3 pl-11 pr-4 rounded-xl text-lg tracking-[0.5em] text-center outline-none focus:ring-2 focus:ring-green-600 shadow-sm text-gray-800 font-bold">
                </div>
                <p class="text-[10px] text-gray-400 mt-2">Hint: Use '1234' for this demo.</p>
            </div>

            <!-- Verify OTP Button (Disabled by Default) -->
            <button type="button" id="verify-btn" disabled onclick="verifyOTP()" class="block text-center w-full bg-green-700 text-white font-bold text-sm py-3.5 rounded-xl shadow-md transition opacity-50 cursor-not-allowed">
                Verify OTP
            </button>
            
            <div class="text-center mt-6">
                <p class="text-xs text-gray-500">Didn't receive code? <button onclick="alert('A new OTP has been sent!')" class="text-green-700 font-bold hover:underline">Resend</button></p>
            </div>
        </div>

    </div>

</div>

<!-- JavaScript to handle the UI Logic -->
<script>
    function sendOTP() {
        const phoneInput = document.getElementById('phone-input').value;
        
        if (phoneInput.length === 10) {
            alert('OTP has been sent to ' + phoneInput);
            
            // Hide Phone section, Show OTP section
            document.getElementById('phone-section').classList.add('hidden');
            document.getElementById('otp-section').classList.remove('hidden');
            
            // Update Headers
            document.getElementById('page-title').innerText = "Verify OTP";
            document.getElementById('page-desc').innerText = "Please enter the 4-digit code sent to " + phoneInput;
        } else {
            alert('Please enter a valid 10-digit phone number.');
        }
    }

    function checkOTP(inputElement) {
        // Strip out non-numbers
        inputElement.value = inputElement.value.replace(/[^0-9]/g, '');
        
        const verifyBtn = document.getElementById('verify-btn');
        
        // If exact 4 digits are entered, enable the button
        if (inputElement.value.length === 4) {
            verifyBtn.disabled = false;
            verifyBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            verifyBtn.classList.add('hover:bg-green-800'); // Add hover effect back
        } else {
            // Otherwise, keep it disabled
            verifyBtn.disabled = true;
            verifyBtn.classList.add('opacity-50', 'cursor-not-allowed');
            verifyBtn.classList.remove('hover:bg-green-800');
        }
    }

    function verifyOTP() {
        const otpValue = document.getElementById('otp-input').value;
        
        // Simulating backend validation
        if (otpValue === '1234') {
            alert('OTP is valid! Proceeding to reset password.');
            window.location.href = 'reset-password.html';
        } else {
            alert('Invalid OTP. Please try again.');
            document.getElementById('otp-input').value = ''; // Clear input on failure
            checkOTP(document.getElementById('otp-input')); // Reset button state
        }
    }
</script>

</body>
</html>

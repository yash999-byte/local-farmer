<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Local Farmer App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .app-container {
            max-width: 414px;
            margin: 0 auto;
            background-color: #f8fafc;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body class="bg-gray-200">

<div class="app-container">
    
    <!-- Header -->
    <div class="px-5 py-4 flex items-center bg-transparent sticky top-0 z-10">
        <a href="forgot-password.html" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-200 transition text-gray-800 -ml-2">
            <i class="fa-solid fa-arrow-left text-lg"></i>
        </a>
    </div>

    <!-- Content Area -->
    <div class="px-6 pt-4 flex-grow flex flex-col">
        
        <!-- Icon & Titles -->
        <div class="mb-8">
            <div class="w-16 h-16 bg-green-100 rounded-2xl flex items-center justify-center text-green-700 text-3xl mb-6 shadow-sm border border-green-200">
                <i class="fa-solid fa-shield-check"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Create New Password</h1>
            <p class="text-sm text-gray-500 leading-relaxed">
                Your new password must be different from previously used passwords.
            </p>
        </div>

        <!-- Form -->
        <form onsubmit="event.preventDefault(); alert('Password successfully reset! Please login with your new password.'); window.location.href='login.html';" class="flex flex-col flex-grow">
            
            <div class="space-y-5 mb-8">
                <!-- New Password -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-2">New Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-[14px] text-gray-400"></i>
                        <input type="password" 
                               id="new-password"
                               placeholder="Enter new password" 
                               required 
                               minlength="8"
                               oninput="validatePasswords()"
                               class="w-full bg-white border border-gray-200 py-3 pl-11 pr-10 rounded-xl text-sm outline-none focus:ring-2 focus:ring-green-600 shadow-sm text-gray-800 font-medium">
                    </div>
                    <p class="text-[10px] text-gray-400 ml-2 mt-1.5">Must be at least 8 characters.</p>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-2">Confirm Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-[14px] text-gray-400"></i>
                        <input type="password" 
                               id="confirm-password"
                               placeholder="Confirm new password" 
                               required 
                               minlength="8"
                               oninput="validatePasswords()"
                               class="w-full bg-white border border-gray-200 py-3 pl-11 pr-10 rounded-xl text-sm outline-none focus:ring-2 focus:ring-green-600 shadow-sm text-gray-800 font-medium">
                    </div>
                    <!-- Error Message (Hidden by Default) -->
                    <p id="error-msg" class="text-[10px] text-red-500 font-bold ml-2 mt-1.5 hidden">Passwords do not match!</p>
                </div>
            </div>

            <!-- Submit Button (Disabled by Default) -->
            <button type="submit" id="submit-btn" disabled class="block text-center w-full bg-green-700 text-white font-bold text-sm py-3.5 rounded-xl shadow-md transition opacity-50 cursor-not-allowed">
                Reset Password
            </button>
            
        </form>
    </div>

</div>

<!-- JavaScript for Password Matching -->
<script>
    function validatePasswords() {
        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;
        const submitBtn = document.getElementById('submit-btn');
        const errorMsg = document.getElementById('error-msg');

        // Only show error if the user has started typing in the confirm field
        if (confirmPassword.length > 0) {
            if (newPassword !== confirmPassword) {
                // Passwords don't match
                errorMsg.classList.remove('hidden');
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                submitBtn.classList.remove('hover:bg-green-800');
            } else {
                // Passwords match
                errorMsg.classList.add('hidden');
                
                // Ensure length is at least 8 before enabling button
                if (newPassword.length >= 8) {
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    submitBtn.classList.add('hover:bg-green-800');
                }
            }
        } else {
            // Confirm field is empty
            errorMsg.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            submitBtn.classList.remove('hover:bg-green-800');
        }
    }
</script>

</body>
</html>

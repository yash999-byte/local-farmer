<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Address - Local Farmer App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .app-container {
            max-width: 414px;
            margin: 0 auto;
            background-color: #f8fafc;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
        /* Custom radio button for address type */
        .type-radio:checked + div {
            background-color: #15803d; /* green-700 */
            color: white;
            border-color: #15803d;
        }
    </style>
</head>
<body class="bg-gray-200">

<div class="app-container">
    
    <!-- Header -->
    <div class="px-5 py-4 flex items-center bg-white sticky top-0 z-10 shadow-sm">
        <a href="addresses.html" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 transition text-gray-800 -ml-2">
            <i class="fa-solid fa-arrow-left text-lg"></i>
        </a>
        <h1 class="text-lg font-bold text-gray-800 ml-2">Add New Address</h1>
    </div>

    <!-- Scrollable Form Area -->
    <form class="flex-grow overflow-y-auto px-5 pt-6 pb-24">
        
        <!-- Contact Details -->
        <h2 class="text-sm font-bold text-gray-800 mb-4 border-b border-gray-200 pb-2">Contact Details</h2>
        
        <div class="mb-4">
            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Full Name</label>
            <input type="text" placeholder="e.g. Rohan Kumar" required class="w-full bg-white border border-gray-200 py-3 px-4 rounded-xl text-sm outline-none focus:ring-2 focus:ring-green-600 shadow-sm text-gray-800 font-medium">
        </div>

        <div class="mb-6">
            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Phone Number</label>
            <input type="tel" placeholder="10-digit mobile number" maxlength="10" required oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="w-full bg-white border border-gray-200 py-3 px-4 rounded-xl text-sm outline-none focus:ring-2 focus:ring-green-600 shadow-sm text-gray-800 font-medium">
        </div>

        <!-- Address Details -->
        <h2 class="text-sm font-bold text-gray-800 mb-4 border-b border-gray-200 pb-2">Address Details</h2>

        <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1.5">Pincode</label>
                <input type="text" placeholder="e.g. 411005" maxlength="6" required oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="w-full bg-white border border-gray-200 py-3 px-4 rounded-xl text-sm outline-none focus:ring-2 focus:ring-green-600 shadow-sm text-gray-800 font-medium">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1.5">City</label>
                <input type="text" placeholder="e.g. Pune" required class="w-full bg-white border border-gray-200 py-3 px-4 rounded-xl text-sm outline-none focus:ring-2 focus:ring-green-600 shadow-sm text-gray-800 font-medium">
            </div>
        </div>

        <div class="mb-4">
            <label class="block text-xs font-semibold text-gray-600 mb-1.5">State</label>
            <input type="text" placeholder="e.g. Maharashtra" required class="w-full bg-white border border-gray-200 py-3 px-4 rounded-xl text-sm outline-none focus:ring-2 focus:ring-green-600 shadow-sm text-gray-800 font-medium">
        </div>

        <div class="mb-4">
            <label class="block text-xs font-semibold text-gray-600 mb-1.5">House No., Building Name</label>
            <input type="text" placeholder="e.g. A-402, Green Valley Apartments" required class="w-full bg-white border border-gray-200 py-3 px-4 rounded-xl text-sm outline-none focus:ring-2 focus:ring-green-600 shadow-sm text-gray-800 font-medium">
        </div>

        <div class="mb-6">
            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Road Name, Area, Colony</label>
            <input type="text" placeholder="e.g. Shivaji Nagar" required class="w-full bg-white border border-gray-200 py-3 px-4 rounded-xl text-sm outline-none focus:ring-2 focus:ring-green-600 shadow-sm text-gray-800 font-medium">
        </div>

        <!-- Address Type -->
        <h2 class="text-sm font-bold text-gray-800 mb-4 border-b border-gray-200 pb-2">Save Address As</h2>
        
        <div class="flex space-x-3 mb-6">
            <label class="cursor-pointer flex-1">
                <input type="radio" name="address_type" class="type-radio absolute opacity-0 w-0 h-0" checked>
                <div class="border border-gray-200 bg-white text-gray-600 font-semibold text-xs py-2.5 rounded-xl text-center transition flex justify-center items-center">
                    <i class="fa-solid fa-house mr-1.5"></i> Home
                </div>
            </label>
            <label class="cursor-pointer flex-1">
                <input type="radio" name="address_type" class="type-radio absolute opacity-0 w-0 h-0">
                <div class="border border-gray-200 bg-white text-gray-600 font-semibold text-xs py-2.5 rounded-xl text-center transition flex justify-center items-center">
                    <i class="fa-solid fa-building mr-1.5"></i> Work
                </div>
            </label>
            <label class="cursor-pointer flex-1">
                <input type="radio" name="address_type" class="type-radio absolute opacity-0 w-0 h-0">
                <div class="border border-gray-200 bg-white text-gray-600 font-semibold text-xs py-2.5 rounded-xl text-center transition flex justify-center items-center">
                    <i class="fa-solid fa-location-dot mr-1.5"></i> Other
                </div>
            </label>
        </div>

        <!-- Default Checkbox -->
        <label class="flex items-center space-x-3 cursor-pointer mb-8">
            <input type="checkbox" class="w-4 h-4 text-green-600 border-gray-300 rounded focus:ring-green-500 accent-green-700">
            <span class="text-sm text-gray-700 font-medium">Make this my default address</span>
        </label>
        
    </form>

    <!-- Fixed Save Button -->
    <div class="absolute bottom-0 w-full bg-white px-5 py-4 border-t border-gray-100 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        <button onclick="window.location.href='addresses.html'" class="block w-full text-center bg-green-700 text-white font-bold text-sm py-3.5 rounded-xl shadow-md hover:bg-green-800 transition">
            Save Address
        </button>
    </div>

</div>

</body>
</html>

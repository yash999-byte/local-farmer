<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Methods - Local Farmer App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .app-container {
            max-width: 414px;
            margin: 0 auto;
            background-color: #f8fafc;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        /* Custom radio button styling */
        .custom-radio:checked + div {
            border-color: #15803d; /* green-700 */
            background-color: #f0fdf4; /* green-50 */
        }
        .custom-radio:checked + div .radio-inner {
            background-color: #15803d;
            border-color: #15803d;
        }
        .radio-inner {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #d1d5db; /* gray-300 */
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .radio-inner::after {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: white;
        }
    </style>
</head>
<body class="bg-gray-200">

<div class="app-container pb-24">
    
    <!-- Header -->
    <div class="px-5 py-4 flex items-center bg-white sticky top-0 z-10 shadow-sm">
        <a href="profile.html" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 transition text-gray-800 -ml-2">
            <i class="fa-solid fa-arrow-left text-lg"></i>
        </a>
        <h1 class="text-lg font-bold text-gray-800 ml-2">Payment Methods</h1>
    </div>

    <!-- Saved Payment Methods List -->
    <div class="px-5 mt-5 space-y-4">
        
        <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">UPI (Preferred)</h2>

        <!-- Option 1: Saved UPI -->
        <label class="cursor-pointer block relative">
            <input type="radio" name="payment_method" class="custom-radio absolute opacity-0 w-0 h-0" checked>
            <div class="bg-white rounded-2xl p-4 shadow-sm border-2 border-gray-100 hover:shadow-md transition flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <div class="w-10 h-10 bg-gray-50 rounded-lg flex items-center justify-center text-xl text-blue-600 border border-gray-100">
                        <i class="fa-brands fa-google-pay"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-gray-800 text-sm">Google Pay</h3>
                        <p class="text-xs text-gray-500 mt-0.5">rohan@okaxis</p>
                    </div>
                </div>
                <div class="radio-inner"></div>
            </div>
        </label>

        <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider mt-6 mb-2">Credit / Debit Cards</h2>

        <!-- Option 2: Saved Visa Card -->
        <label class="cursor-pointer block relative">
            <input type="radio" name="payment_method" class="custom-radio absolute opacity-0 w-0 h-0">
            <div class="bg-white rounded-2xl p-4 shadow-sm border-2 border-gray-100 hover:shadow-md transition flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <div class="w-10 h-10 bg-blue-50 rounded-lg flex items-center justify-center text-xl text-blue-800 border border-blue-100">
                        <i class="fa-brands fa-cc-visa"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-gray-800 text-sm">HDFC Bank Visa</h3>
                        <p class="text-xs text-gray-500 mt-0.5">**** **** **** 4242</p>
                    </div>
                </div>
                <div class="radio-inner"></div>
            </div>
        </label>

        <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider mt-6 mb-2">Other Options</h2>

        <!-- Option 3: Cash on Delivery -->
        <label class="cursor-pointer block relative">
            <input type="radio" name="payment_method" class="custom-radio absolute opacity-0 w-0 h-0">
            <div class="bg-white rounded-2xl p-4 shadow-sm border-2 border-gray-100 hover:shadow-md transition flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <div class="w-10 h-10 bg-green-50 rounded-lg flex items-center justify-center text-xl text-green-700 border border-green-100">
                        <i class="fa-solid fa-money-bill-wave"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-gray-800 text-sm">Cash on Delivery (COD)</h3>
                        <p class="text-xs text-gray-500 mt-0.5">Pay at your doorstep</p>
                    </div>
                </div>
                <div class="radio-inner"></div>
            </div>
        </label>

    </div>

    <!-- Fixed Add New Payment Button -->
    <div class="fixed bottom-0 w-full max-w-[414px] bg-white px-5 py-4 border-t border-gray-100 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        <a href="add-payment.html" class="w-full bg-green-700 text-white font-bold text-sm py-3.5 rounded-xl shadow-md hover:bg-green-800 transition flex items-center justify-center">
            <i class="fa-solid fa-plus mr-2"></i> Add New Payment Method
        </a>
    </div>

</body>
</html>
